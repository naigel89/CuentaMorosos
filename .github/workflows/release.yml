name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nombre del tag (ej: v1.0.0)'
        required: false
        type: string

jobs:
  release:
    name: Build & Release signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Tag efectivo. El input de workflow_dispatch estaba declarado pero nunca
    # se usaba: los pasos leían github.ref_name, que al lanzar a mano desde una
    # rama es el nombre de la rama, no un tag.
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle cache ──────────────────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 4. google-services.json ──────────────────────────────────────────
      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "google-services.json injected successfully."
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not set. Build will fail if Firebase is required."
          fi

      # ── 5. Run unit tests ────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --continue

      # ── 6. Build release APK (firmado con keystore del repo) ─────────────
      - name: Build release APK
        # El .jks vive en el repo (ver .gitignore), pero las credenciales no.
        # Sin este env, getRequiredProperty en app/build.gradle.kts aborta con
        # "Missing keystore credential" y la release nunca llega a firmarse.
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # ── 6b. Renombrar el APK al nombre que enlaza la landing ─────────────
      # docs/index.html apunta a CuentaMorosos-<tag>.apk. Sin esta copia el
      # asset se publica como app-release.apk y el botón de descarga da 404.
      # Es cp y no mv a propósito: el paso 7 (App Distribution) resuelve la ruta
      # del artefacto desde la variante de AGP y sigue esperando app-release.apk.
      - name: Copy APK to release asset names
        run: |
          out=app/build/outputs/apk/release
          cp "$out/app-release.apk" "$out/CuentaMorosos-${RELEASE_TAG}.apk"
          # Segunda copia con nombre estable. Es la que enlaza la landing a
          # través de /releases/latest/download/CuentaMorosos.apk: un permalink
          # que siempre sirve la última versión, así docs/index.html no queda
          # obsoleto cada vez que se publica una release.
          cp "$out/app-release.apk" "$out/CuentaMorosos.apk"

      # ── 7. Upload to Firebase App Distribution ───────────────────────────
      # Requiere: secret FIREBASE_SERVICE_ACCOUNT con JSON de service account
      # (rol: Firebase App Distribution Admin). Si no está configurado, se saltea.
      - name: Distribute to Firebase App Distribution
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            ./gradlew :app:appDistributionUploadRelease
          else
            echo "SKIP: FIREBASE_SERVICE_ACCOUNT secret not configured"
          fi

      # ── 8. Upload APK as workflow artifact ───────────────────────────────
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CuentaMorosos-${{ env.RELEASE_TAG }}
          path: app/build/outputs/apk/release/CuentaMorosos-${{ env.RELEASE_TAG }}.apk
          retention-days: 90

      # ── 9. Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/CuentaMorosos-${{ env.RELEASE_TAG }}.apk
            app/build/outputs/apk/release/CuentaMorosos.apk
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          name: CuentaMorosos ${{ env.RELEASE_TAG }}
          body: |
            🎉 **CuentaMorosos ${{ env.RELEASE_TAG }}** — Divide gastos. Sin vueltas. Sin cuentas pendientes.

            ## Novedades
            - Gestión completa de **eventos** con gastos compartidos
            - **6 modos de reparto**: consumo real, media simple, por categoría, % personalizado, importe exacto, por partes
            - **Motor de liquidación inteligente** con greedy + round-robin que minimiza transferencias
            - **Soporte offline-first** con SQLDelight + sincronización escalonada con Firestore
            - **11 categorías** de gasto con iconos y colores
            - **Roles**: propietario, colaborador, lector
            - **Notificaciones push** (FCM) y recordatorios locales
            - **Panel de control** con balances y resúmenes financieros
            - **Modo oscuro** con diseño NeoFintech

            ## Instalación
            1. Descargá el APK desde esta release, o desde
               [la página de descarga](https://naigel89.github.io/CuentaMorosos/),
               que apunta siempre a la última versión
            2. En tu Android, habilitá "Instalar apps desconocidas" para tu navegador/files
            3. Abrí el APK y seguí las instrucciones

            > ⚠️ Requiere Android 7.0 (API 24) o superior
          draft: false
          prerelease: false
