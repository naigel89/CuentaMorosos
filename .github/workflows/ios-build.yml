name: iOS Build & Test

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build and test iOS framework
    # Pin both the image and Xcode; runner defaults change over time.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true

      - name: Report pinned Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          ruby --version
          bundle --version
          bundle exec pod --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle and Kotlin/Native dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-konan-

      - name: Link debug framework for iOS Simulator (arm64)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # The test executable needs FirebaseCore from the future CocoaPods host
      # integration. Until then, compile Native tests to catch source-set leaks.
      - name: Compile shared tests for iOS Simulator (arm64)
        run: ./gradlew :shared:compileTestKotlinIosSimulatorArm64 --stacktrace

      - name: Upload iOS simulator framework
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shared-framework-ios-simulator
          path: shared/build/bin/iosSimulatorArm64/debugFramework/
          retention-days: 14
