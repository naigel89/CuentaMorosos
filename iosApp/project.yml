# Proyecto Xcode generado con XcodeGen.
#
# El .xcodeproj NO se versiona: es un project.pbxproj de cientos de líneas de
# UUIDs que no se puede revisar en un diff ni regenerar sin abrir Xcode. Se
# versiona este YAML y el proyecto se materializa con `xcodegen generate`, como
# cualquier otro artefacto de build.

name: iosApp
options:
  bundleIdPrefix: com.cuentamorosos
  deploymentTarget:
    iOS: "15.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # El framework de Kotlin/Native es estático (isStatic = true en
    # shared/build.gradle.kts), así que se linka, no se embebe: basta con
    # apuntar la búsqueda a la salida de linkDebugFrameworkIosSimulatorArm64.
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Kotlin/Native solo produce slice arm64 para simulador.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CuentaMorosos
        CFBundleShortVersionString: "1.2.1"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        # Compose lo pide explícitamente; sin ella el render se capa a 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuentamorosos
        # Sin cuenta Apple Developer no hay firma; CI construye para simulador,
        # que no la requiere.
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework
        embed: false
      # El driver nativo de SQLDelight (SQLiter) hace cinterop con SQLite y deja
      # los símbolos sin resolver: _sqlite3_bind_blob y compañía los tiene que
      # aportar el binario final.
      - sdk: libsqlite3.tbd
    postBuildScripts:
      # Las tipografías de Compose no viajan dentro del .framework: Gradle las
      # deja aparte. Sin copiarlas al bundle, Res.font.geist_regular lanza
      # MissingResourceException y la app muere al pintar el primer texto.
      # Se busca el directorio en vez de fijar la ruta, que cambia entre
      # versiones de Compose Multiplatform.
      - name: Copy Compose resources
        script: |
          set -eu
          ROOT="$SRCROOT/.."
          # Compose no deja un directorio llamado "compose-resources" en ningún
          # sitio: los prepara aquí, con el nombre del source set.
          SRC=$(find "$ROOT/shared/build/generated/compose/resourceGenerator/preparedResources" \
                  -type d -name composeResources 2>/dev/null | head -1)
          # Si el build aún no los ha preparado, la fuente vale: mismo layout.
          if [ -z "${SRC:-}" ]; then
            SRC="$ROOT/shared/src/commonMain/composeResources"
          fi
          if [ ! -d "$SRC" ]; then
            echo "error: no se encontraron los recursos de Compose" >&2
            exit 1
          fi
          # Ojo al guion: el runtime los busca en "compose-resources", no en
          # "composeResources".
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/compose-resources"
          echo "Recursos de Compose: $SRC -> $DEST"
          mkdir -p "$DEST"
          rsync -a --delete "$SRC/" "$DEST/"
          find "$DEST" -type f | head -10
        basedOnDependencyAnalysis: false

    preBuildScripts:
      - name: Link Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
        basedOnDependencyAnalysis: false

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    archive:
      config: Debug
